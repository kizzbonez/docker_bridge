# DockerBridge: a static site and a small API behind a sign-in wall.
#
# Public:     /login/ /setup/ (the portal page), /portal/* (its own bundle),
#             /auth/* (the auth API, which enforces its own sessions), /healthz.
# Protected:  everything else. nginx asks the auth service before serving any
#             file or forwarding any /api/ request. Without a session, a page
#             redirects to /login/, the API answers 401, and any other file
#             answers 404.
#
# This container has no access to a Docker socket. The console service behind
# /api/ does, which is why nothing reaches it without a session.

# Coarse shield for the credential endpoints. The precise brute-force control,
# a lockout per client and account, lives in the auth service.
limit_req_zone $binary_remote_addr zone=credentials:1m rate=60r/m;

# The live console polls a few endpoints every few seconds; this leaves room
# for several open tabs and stops a runaway script.
limit_req_zone $binary_remote_addr zone=console:1m rate=10r/s;

# POST is accepted by the auth API and by the console's one tool endpoint;
# every other path is read-only.
map "$request_method:$uri" $method_denied {
    default                    1;
    ~^(GET|HEAD):              0;
    ~^POST:/auth/              0;
    ~^POST:/api/tools/call$    0;
}

# What an anonymous visitor gets for a protected path. Pages are sent to
# sign-in; anything that looks like a file is a plain 404, so a probe for
# /backup.sql or /.env.bak never ends on a 200 page and learns nothing about
# what exists behind the wall.
map $uri $anonymous_gets_signin {
    default        1;
    ~\.html?$      1;
    ~\.[^/.]+$     0;
}

# Honour the scheme reported by a TLS-terminating proxy or tunnel in front,
# so session cookies are marked Secure when the visitor is on HTTPS.
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https   https;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    server_tokens off;
    # Keep redirects relative so they survive the host port mapping (8742 -> 8080).
    absolute_redirect off;

    # Small bodies and impatient timeouts: the largest request is a sign-in form.
    client_max_body_size 4k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    keepalive_timeout 15s;
    large_client_header_buffers 2 4k;
    limit_req_status 429;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv text/plain;

    # Docker's embedded DNS, re-resolved so a restarted auth container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://auth:8081;
    # Resolved per request, so the site still starts when the console is not running.
    set $console_upstream http://console:8082;

    # The visitor's address. Published through a Cloudflare tunnel, every
    # request reaches nginx from the same private address, with the real client
    # in CF-Connecting-IP (Cloudflare sets it and overwrites anything a visitor
    # sends). Trusting that header is what keeps lockouts, rate limits and the
    # audit log per visitor rather than per tunnel.
    #
    # It is trusted from private addresses only, and the port is published on
    # 127.0.0.1, so the only parties who could forge it are processes already
    # on this machine. Do not publish the port more widely without revisiting
    # this.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    if ($method_denied) {
        return 405;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Dotfiles (.env, .git, ...) are never served.
    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    # ---- public: the sign-in and first-time-setup portal ---------------------
    location = /login { return 301 /login/; }
    location = /setup { return 301 /setup/; }

    location ~ ^/(login|setup)/$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files /portal/index.html =404;
    }

    # The portal's own fingerprinted bundle: the only static files served
    # without a session. Its HTML is reachable through /login/ and /setup/ only.
    location = /portal/index.html { return 404; }
    location /portal/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ---- public: auth API ----------------------------------------------------
    # The session check is for nginx's own subrequests, not for visitors.
    location = /auth/verify { return 404; }

    location ~ ^/auth/(login|setup)(/|$) {
        limit_req zone=credentials burst=20 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/auth-proxy.conf;
        proxy_pass $auth_upstream;
    }

    location /auth/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/auth-proxy.conf;
        proxy_pass $auth_upstream;
    }

    # ---- internal: "is this visitor signed in?" ------------------------------
    location = /_session {
        internal;
        include /etc/nginx/snippets/auth-proxy.conf;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_pass $auth_upstream/auth/verify;
    }

    location @signin {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        if ($anonymous_gets_signin = 0) {
            return 404;
        }
        # $request_uri is the raw request line, so it cannot carry a CR/LF into
        # the header. The portal validates `next` before following it.
        return 302 /login/?next=$request_uri;
    }

    # ---- protected: the live console's API ------------------------------------
    # The only path that leads to a service holding the Docker socket. The
    # console checks the session again itself; this check is not the only one.
    location @api_denied {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 401 '{"error":"unauthenticated"}';
    }

    location /api/ {
        auth_request /_session;
        error_page 401 = @api_denied;
        limit_req zone=console burst=40 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/auth-proxy.conf;
        # The console marks its own answers no-store.
        #
        # A variable upstream normally means "a request can choose where nginx
        # connects". This one is the fixed address set above; it is a variable
        # only so that nginx starts when the console is not running.
        proxy_pass $console_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
    }

    # ---- protected: everything else ------------------------------------------
    # "private" keeps a CDN or shared proxy in front from caching protected
    # files and replaying them to someone who is not signed in.
    location /assets/ {
        auth_request /_session;
        error_page 401 = @signin;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        auth_request /_session;
        error_page 401 = @signin;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ =404;
    }
}
