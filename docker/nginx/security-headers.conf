# Included by every location block: nginx does not inherit add_header into a
# block that declares its own, so the full set is repeated via this snippet.
#
# The CSP allows first-party files only. There is no 'unsafe-inline', no nonce
# and no third-party origin, because the build emits none of those.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# A private console: keep it out of search indexes even if it is ever reachable.
add_header X-Robots-Tag "noindex, nofollow" always;
# Ignored by browsers over plain HTTP; takes effect once a TLS proxy or tunnel fronts the site.
add_header Strict-Transport-Security "max-age=31536000" always;
