# Shared settings for every request forwarded to the auth service.
#
# X-Real-IP is overwritten with the socket address, so a client cannot spoof
# the address that the brute-force lockout is keyed on.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $client_scheme;
proxy_set_header Connection "";
# nginx adds the security headers itself; drop the upstream copy so none is duplicated.
proxy_hide_header X-Content-Type-Options;
proxy_connect_timeout 3s;
proxy_send_timeout 5s;
proxy_read_timeout 15s;
